<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サッカー部 振り返りノート</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for JSX Compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Lucide Icon コンポーネント用ヘルパー ---
    const Icon = ({ name, className = "w-4 h-4", ...props }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);
      return <i data-lucide={name} class={className} {...props}></i>;
    };

    // 初期データ
    const INITIAL_MEMBERS = [];
    const INITIAL_MATCHES = [];
    const INITIAL_NOTES = [];
    const INITIAL_GOALS = [];

    function SoccerNoteApp() {
      // --- 💾 ローカルストレージフック ---
      const usePersistentState = (key, initialValue) => {
        const [state, setState] = useState(() => {
          try {
            const saved = localStorage.getItem(`soccer_note_${key}`);
            return saved ? JSON.parse(saved) : initialValue;
          } catch (e) {
            console.error('Storage Read Error:', e);
            return initialValue;
          }
        });

        useEffect(() => {
          try {
            localStorage.setItem(`soccer_note_${key}`, JSON.stringify(state));
          } catch (e) {
            console.error('Storage Save Error:', e);
          }
        }, [key, state]);

        return [state, setState];
      };

      const [members, setMembers] = usePersistentState('members', INITIAL_MEMBERS);
      const [matches, setMatches] = usePersistentState('matches', INITIAL_MATCHES);
      const [notes, setNotes] = usePersistentState('notes', INITIAL_NOTES);
      const [goals, setGoals] = usePersistentState('goals', INITIAL_GOALS);

      const [role, setRole] = useState('student');
      const [isCoachAuthenticated, setIsCoachAuthenticated] = useState(false);
      const [coachPasscode] = useState('1234');
      const [inputPasscode, setInputPasscode] = useState('');
      const [showPasscodeModal, setShowPasscodeModal] = useState(false);

      const [currentStudentId, setCurrentStudentId] = useState(members[0]?.id || '');
      const [activeTab, setActiveTab] = useState(members.length === 0 ? 'members' : 'notes');
      
      const [filterType, setFilterType] = useState('all');
      const [selectedStudentFilter, setSelectedStudentFilter] = useState('all');
      const [teamSearchQuery, setTeamSearchQuery] = useState('');

      const [newMatch, setNewMatch] = useState({
        date: new Date().toISOString().split('T')[0],
        category: 'A戦 (公式戦)',
        opponent: '',
        ourScore: 0,
        opponentScore: 0,
        formation: '4-3-3',
        competition: '',
        notes: ''
      });

      const [newNote, setNewNote] = useState({
        type: '試合',
        category: 'A戦 (公式戦)',
        title: '',
        date: new Date().toISOString().split('T')[0],
        condition: 3,
        fatigue: 3,
        sleepHours: 7.0,
        theme: '',
        goodPoints: '',
        badPoints: '',
        nextAction: '',
        selectedMatchId: '',
        customOpponent: '',
        minutesPlayed: 70,
        goals: 0,
        assists: 0,
      });

      const [selectedNote, setSelectedNote] = useState(null);
      const [replyText, setReplyText] = useState('');
      const [replyRating, setReplyRating] = useState(5);
      const [isMomCheck, setIsMomCheck] = useState(false);
      const [coachName, setCoachName] = useState('監督（佐藤）');

      const [replyToCoachNote, setReplyToCoachNote] = useState(null);
      const [studentReplyText, setStudentReplyText] = useState('');

      const [editingMember, setEditingMember] = useState({ name: '', grade: '1年', position: 'FW', number: '' });
      const [showAddMember, setShowAddMember] = useState(members.length === 0);
      const [currentGoal, setCurrentGoal] = useState({ yearGoal: '', monthGoal: '' });

      const currentStudent = members.find(m => m.id === currentStudentId) || members[0] || null;

      useEffect(() => {
        if (members.length > 0 && !currentStudentId) {
          setCurrentStudentId(members[0].id);
        }
      }, [members, currentStudentId]);

      useEffect(() => {
        if (!currentStudentId) return;
        const existingGoal = goals.find(g => g.studentId === currentStudentId);
        if (existingGoal) {
          setCurrentGoal({ yearGoal: existingGoal.yearGoal, monthGoal: existingGoal.monthGoal });
        } else {
          setCurrentGoal({ yearGoal: '', monthGoal: '' });
        }
      }, [currentStudentId, goals]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // ストリーク計算
      const calculateStreak = (studentId) => {
        const studentNotes = notes.filter(n => n.studentId === studentId);
        if (studentNotes.length === 0) return { currentStreak: 0, totalDays: 0 };

        const uniqueDates = Array.from(new Set(studentNotes.map(n => n.date))).sort((a, b) => new Date(b) - new Date(a));
        const totalDays = uniqueDates.length;

        if (totalDays === 0) return { currentStreak: 0, totalDays: 0 };

        let streak = 0;
        const today = new Date().toISOString().split('T')[0];
        const yesterdayDate = new Date();
        yesterdayDate.setDate(yesterdayDate.getDate() - 1);
        const yesterday = yesterdayDate.toISOString().split('T')[0];

        const latestDateStr = uniqueDates[0];
        if (latestDateStr !== today && latestDateStr !== yesterday) {
          return { currentStreak: 0, totalDays };
        }

        streak = 1;
        for (let i = 1; i < uniqueDates.length; i++) {
          const prevDate = new Date(uniqueDates[i - 1]);
          const currDate = new Date(uniqueDates[i]);
          const diffTime = Math.abs(prevDate - currDate);
          const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

          if (diffDays === 1) {
            streak++;
          } else {
            break;
          }
        }

        return { currentStreak: streak, totalDays };
      };

      const studentStreakInfo = currentStudent ? calculateStreak(currentStudent.id) : { currentStreak: 0, totalDays: 0 };

      const handleMatchSelect = (matchId) => {
        if (!matchId) {
          setNewNote(prev => ({ ...prev, selectedMatchId: '', customOpponent: '' }));
          return;
        }
        const match = matches.find(m => m.id === matchId);
        if (match) {
          setNewNote(prev => ({
            ...prev,
            selectedMatchId: match.id,
            category: match.category || 'A戦 (公式戦)',
            date: match.date,
            customOpponent: match.opponent,
            title: `【${match.category || '試合'}】${match.competition || ''} vs ${match.opponent}`
          }));
        }
      };

      const handleCreateMatch = (e) => {
        e.preventDefault();
        if (!newMatch.opponent) {
          alert('対戦相手を入力してください。');
          return;
        }

        const created = { id: `m_${Date.now()}`, ...newMatch };
        setMatches([created, ...matches]);
        setNewMatch({
          date: new Date().toISOString().split('T')[0],
          category: 'A戦 (公式戦)',
          opponent: '',
          ourScore: 0,
          opponentScore: 0,
          formation: '4-3-3',
          competition: '',
          notes: ''
        });
        alert('試合データを登録しました！');
      };

      const handleCreateNote = (e) => {
        e.preventDefault();
        if (!currentStudent) {
          alert('先に部員登録を行ってください。');
          return;
        }
        if (!newNote.title || !newNote.goodPoints) {
          alert('タイトルと「成果・良かった点」は必須です。');
          return;
        }

        let matchInfo = {
          matchId: '',
          opponent: newNote.customOpponent || '',
          ourScore: 0,
          opponentScore: 0,
          formation: ''
        };

        if (newNote.type === '試合' && newNote.selectedMatchId) {
          const m = matches.find(item => item.id === newNote.selectedMatchId);
          if (m) {
            matchInfo = {
              matchId: m.id,
              opponent: newNote.customOpponent || m.opponent,
              ourScore: m.ourScore,
              opponentScore: m.opponentScore,
              formation: m.formation
            };
          }
        }

        const created = {
          id: `n_${Date.now()}`,
          studentId: currentStudent.id,
          studentName: currentStudent.name,
          ...newNote,
          ...matchInfo,
          coachComment: '',
          coachName: '',
          coachRating: 0,
          isMom: false,
          commentDate: '',
          studentReply: '',
          replyDate: '',
          status: 'pending'
        };

        setNotes([created, ...notes]);
        setActiveTab('notes');
        setNewNote({
          type: '試合',
          category: 'A戦 (公式戦)',
          title: '',
          date: new Date().toISOString().split('T')[0],
          condition: 3,
          fatigue: 3,
          sleepHours: 7.0,
          theme: '',
          goodPoints: '',
          badPoints: '',
          nextAction: '',
          selectedMatchId: '',
          customOpponent: '',
          minutesPlayed: 70,
          goals: 0,
          assists: 0,
        });
      };

      const handleVerifyPasscode = (e) => {
        e.preventDefault();
        if (inputPasscode === coachPasscode) {
          setIsCoachAuthenticated(true);
          setRole('coach');
          setShowPasscodeModal(false);
          setInputPasscode('');
          setActiveTab('notes');
        } else {
          alert('パスコードが正しくありません。');
        }
      };

      const handleSendReply = () => {
        if (!replyText.trim()) return;

        const updatedNotes = notes.map(note => {
          if (note.id === selectedNote.id) {
            return {
              ...note,
              coachComment: replyText,
              coachName: coachName,
              coachRating: replyRating,
              isMom: isMomCheck,
              commentDate: new Date().toLocaleString('ja-JP'),
              status: 'replied'
            };
          }
          return note;
        });

        setNotes(updatedNotes);
        setSelectedNote(null);
        setReplyText('');
        setIsMomCheck(false);
      };

      const handleSendStudentReply = () => {
        if (!studentReplyText.trim()) return;

        const updatedNotes = notes.map(note => {
          if (note.id === replyToCoachNote.id) {
            return {
              ...note,
              studentReply: studentReplyText,
              replyDate: new Date().toLocaleString('ja-JP')
            };
          }
          return note;
        });

        setNotes(updatedNotes);
        setReplyToCoachNote(null);
        setStudentReplyText('');
      };

      const handleSaveGoal = (e) => {
        e.preventDefault();
        if (!currentStudentId) return;

        const updated = goals.map(g => {
          if (g.studentId === currentStudentId) {
            return { ...g, yearGoal: currentGoal.yearGoal, monthGoal: currentGoal.monthGoal, updatedAt: new Date().toISOString().split('T')[0] };
          }
          return g;
        });

        if (!goals.some(g => g.studentId === currentStudentId)) {
          updated.push({
            id: `g_${Date.now()}`,
            studentId: currentStudentId,
            yearGoal: currentGoal.yearGoal,
            monthGoal: currentGoal.monthGoal,
            updatedAt: new Date().toISOString().split('T')[0]
          });
        }

        setGoals(updated);
        alert('目標を保存しました！');
      };

      const handleAddMember = (e) => {
        e.preventDefault();
        if (!editingMember.name) return;
        
        const newM = {
          id: `m_${Date.now()}`,
          name: editingMember.name,
          grade: editingMember.grade,
          position: editingMember.position,
          number: parseInt(editingMember.number) || 0
        };
        
        setMembers([...members, newM]);
        setCurrentStudentId(newM.id);
        setEditingMember({ name: '', grade: '1年', position: 'FW', number: '' });
        setShowAddMember(false);
      };

      const handleDeleteMember = (id) => {
        if (window.confirm('この部員を削除しますか？')) {
          const nextMembers = members.filter(m => m.id !== id);
          setMembers(nextMembers);
          if (currentStudentId === id) setCurrentStudentId(nextMembers[0]?.id || '');
        }
      };

      const myFilteredNotes = notes.filter(note => {
        if (role === 'student' && currentStudentId && note.studentId !== currentStudentId) return false;
        if (role === 'coach' && selectedStudentFilter !== 'all' && note.studentId !== selectedStudentFilter) return false;
        if (filterType === 'pending') return note.status === 'pending';
        if (filterType === 'replied') return note.status === 'replied';
        if (filterType === 'a_match') return note.category?.includes('A戦');
        if (filterType === 'b_match') return note.category?.includes('B戦');
        if (filterType === 'practice') return note.type === '練習';
        return true;
      });

      const teamFilteredNotes = notes.filter(note => {
        if (selectedStudentFilter !== 'all' && note.studentId !== selectedStudentFilter) return false;
        if (filterType === 'a_match' && !note.category?.includes('A戦')) return false;
        if (filterType === 'b_match' && !note.category?.includes('B戦')) return false;
        if (teamSearchQuery.trim()) {
          const q = teamSearchQuery.toLowerCase();
          return (
            note.studentName.toLowerCase().includes(q) ||
            note.title.toLowerCase().includes(q) ||
            (note.opponent && note.opponent.toLowerCase().includes(q)) ||
            note.goodPoints.toLowerCase().includes(q) ||
            note.theme.toLowerCase().includes(q)
          );
        }
        return true;
      });

      const calculateStats = () => {
        const totalGoals = notes.reduce((acc, n) => acc + (n.goals || 0), 0);
        const totalAssists = notes.reduce((acc, n) => acc + (n.assists || 0), 0);
        const totalMoms = notes.filter(n => n.isMom).length;
        
        const studentStats = members.map(m => {
          const studentNotes = notes.filter(n => n.studentId === m.id);
          const goalsCount = studentNotes.reduce((acc, n) => acc + (n.goals || 0), 0);
          const assistsCount = studentNotes.reduce((acc, n) => acc + (n.assists || 0), 0);
          const momsCount = studentNotes.filter(n => n.isMom).length;
          const { currentStreak, totalDays } = calculateStreak(m.id);

          return {
            id: m.id,
            name: m.name,
            position: m.position,
            goals: goalsCount,
            assists: assistsCount,
            moms: momsCount,
            currentStreak,
            totalDays
          };
        }).sort((a, b) => b.currentStreak - a.currentStreak || (b.moms * 10 + b.goals) - (a.moms * 10 + a.goals));

        return { totalGoals, totalAssists, totalMoms, matchCount: matches.length, studentStats };
      };

      const stats = calculateStats();

      return (
        <div className="min-h-screen flex flex-col antialiased">
          {/* Header */}
          <header className="bg-emerald-900 text-white sticky top-0 z-30 shadow-md border-b border-emerald-800">
            <div className="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
              <div className="flex items-center space-x-2">
                <div className="p-2 bg-emerald-700 rounded-lg shadow-inner">
                  <Icon name="activity" className="w-5 h-5 text-amber-400" />
                </div>
                <div>
                  <h1 className="font-black text-lg tracking-wide flex items-center gap-1.5">
                    サッカー部 振り返りノート
                  </h1>
                  <p className="text-[10px] text-emerald-200">サッカーノート＆指導者コミュニケーション</p>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                {role === 'student' ? (
                  <button
                    onClick={() => {
                      if (isCoachAuthenticated) {
                        setRole('coach');
                        setActiveTab('notes');
                      } else {
                        setShowPasscodeModal(true);
                      }
                    }}
                    className="bg-emerald-800 hover:bg-emerald-700 text-emerald-100 text-xs px-3 py-1.5 rounded-lg font-bold flex items-center space-x-1 border border-emerald-700 transition"
                  >
                    <Icon name="lock" className="w-3.5 h-3.5 mr-1" /> 監督・コーチモードへ
                  </button>
                ) : (
                  <button
                    onClick={() => setRole('student')}
                    className="bg-amber-500 hover:bg-amber-600 text-slate-900 text-xs px-3 py-1.5 rounded-lg font-bold flex items-center space-x-1 shadow transition"
                  >
                    <Icon name="user" className="w-3.5 h-3.5 mr-1" /> 選手モードに戻る
                  </button>
                )}
              </div>
            </div>

            {role === 'student' && (
              <div className="bg-emerald-800 px-4 py-2 border-t border-emerald-600/50">
                <div className="max-w-4xl mx-auto flex items-center justify-between text-xs flex-wrap gap-2">
                  <div className="flex items-center space-x-2">
                    <span className="text-emerald-200 font-medium">現在の記入者:</span>
                    {members.length > 0 ? (
                      <select
                        value={currentStudentId}
                        onChange={(e) => setCurrentStudentId(e.target.value)}
                        className="bg-emerald-900 border border-emerald-600 text-white rounded px-2.5 py-1 focus:outline-none focus:ring-1 focus:ring-amber-400 font-bold"
                      >
                        {members.map(m => (
                          <option key={m.id} value={m.id}>
                            {m.name} ({m.position === 'MG' ? 'マネージャー' : `${m.grade} / ${m.position} #${m.number}`})
                          </option>
                        ))}
                      </select>
                    ) : (
                      <span className="text-amber-300 font-bold">※部員が未登録です</span>
                    )}
                  </div>

                  {currentStudent && (
                    <div className="flex items-center space-x-3 bg-emerald-900/80 px-3 py-1 rounded-full border border-emerald-700">
                      <div className="flex items-center space-x-1 text-amber-400 font-bold">
                        <Icon name="flame" className="w-4 h-4 text-amber-400 fill-amber-400 animate-pulse" />
                        <span>{studentStreakInfo.currentStreak}日 連続継続中！</span>
                      </div>
                      <span className="text-emerald-400">|</span>
                      <div className="text-emerald-200 text-[11px]">
                        通算 <b>{studentStreakInfo.totalDays}</b> 日間提出
                      </div>
                    </div>
                  )}

                  <div className="flex items-center space-x-3">
                    <button
                      onClick={() => { setActiveTab('members'); setShowAddMember(true); }}
                      className="text-emerald-200 hover:text-white underline flex items-center text-[11px]"
                    >
                      <Icon name="user-plus" className="w-3 h-3 mr-1" /> 部員追加・編集
                    </button>
                    <button
                      onClick={() => {
                        const data = { members, matches, notes, goals };
                        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `soccer_note_backup_${new Date().toISOString().split('T')[0]}.json`;
                        a.click();
                        URL.revokeObjectURL(url);
                      }}
                      className="text-amber-300 hover:text-amber-200 underline flex items-center text-[11px] font-bold"
                      title="データをファイルにバックアップ保存"
                    >
                      <Icon name="download" className="w-3 h-3 mr-1" /> データ保存
                    </button>
                  </div>
                </div>
              </div>
            )}
          </header>

          {/* Navigation */}
          <nav className="bg-white border-b border-slate-200 sticky top-[57px] z-20 shadow-sm">
            <div className="max-w-4xl mx-auto px-2 flex overflow-x-auto text-sm font-medium">
              <button
                onClick={() => setActiveTab('notes')}
                className={`py-3 px-3.5 flex items-center border-b-2 transition whitespace-nowrap ${
                  activeTab === 'notes' ? 'border-emerald-600 text-emerald-700 font-bold' : 'border-transparent text-slate-500 hover:text-slate-800'
                }`}
              >
                <Icon name="book-open" className="w-4 h-4 mr-1.5" />
                {role === 'student' ? '自分のノート' : '監督レビュー一覧'}
                {role === 'coach' && (
                  <span className="ml-1.5 bg-amber-500 text-white text-xs px-1.5 py-0.5 rounded-full font-normal">
                    {notes.filter(n => n.status === 'pending').length}未読
                  </span>
                )}
              </button>

              {role === 'student' && (
                <button
                  onClick={() => setActiveTab('create')}
                  className={`py-3 px-3.5 flex items-center border-b-2 transition whitespace-nowrap ${
                    activeTab === 'create' ? 'border-emerald-600 text-emerald-700 font-bold' : 'border-transparent text-slate-500 hover:text-slate-800'
                  }`}
                >
                  <Icon name="plus" className="w-4 h-4 mr-1.5" />
                  ノートを書く
                </button>
              )}

              <button
                onClick={() => setActiveTab('team_notes')}
                className={`py-3 px-3.5 flex items-center border-b-2 transition whitespace-nowrap ${
                  activeTab === 'team_notes' ? 'border-emerald-600 text-emerald-700 font-bold' : 'border-transparent text-slate-500 hover:text-slate-800'
                }`}
              >
                <Icon name="users" className="w-4 h-4 mr-1.5" />
                全員の振り返り・MOM共有
              </button>

              <button
                onClick={() => setActiveTab('goals')}
                className={`py-3 px-3.5 flex items-center border-b-2 transition whitespace-nowrap ${
                  activeTab === 'goals' ? 'border-emerald-600 text-emerald-700 font-bold' : 'border-transparent text-slate-500 hover:text-slate-800'
                }`}
              >
                <Icon name="target" className="w-4 h-4 mr-1.5" />
                目標設定
              </button>

              <button
                onClick={() => setActiveTab('dashboard')}
                className={`py-3 px-3.5 flex items-center border-b-2 transition whitespace-nowrap ${
                  activeTab === 'dashboard' ? 'border-emerald-600 text-emerald-700 font-bold' : 'border-transparent text-slate-500 hover:text-slate-800'
                }`}
              >
                <Icon name="bar-chart-2" className="w-4 h-4 mr-1.5" />
                継続率・スタッツ分析
              </button>

              <button
                onClick={() => setActiveTab('match_manage')}
                className={`py-3 px-3.5 flex items-center border-b-2 transition whitespace-nowrap ${
                  activeTab === 'match_manage' ? 'border-emerald-600 text-emerald-700 font-bold' : 'border-transparent text-slate-500 hover:text-slate-800'
                }`}
              >
                <Icon name="trophy" className="w-4 h-4 mr-1.5 text-amber-500" />
                試合の事前登録（A戦/B戦）
              </button>

              <button
                onClick={() => setActiveTab('members')}
                className={`py-3 px-3.5 flex items-center border-b-2 transition whitespace-nowrap ${
                  activeTab === 'members' ? 'border-emerald-600 text-emerald-700 font-bold' : 'border-transparent text-slate-500 hover:text-slate-800'
                }`}
              >
                <Icon name="user-plus" className="w-4 h-4 mr-1.5" />
                部員登録・管理 ({members.length})
              </button>

              <button
                onClick={() => setActiveTab('settings')}
                className={`py-3 px-3.5 flex items-center border-b-2 transition whitespace-nowrap ${
                  activeTab === 'settings' ? 'border-emerald-600 text-emerald-700 font-bold' : 'border-transparent text-slate-500 hover:text-slate-800'
                }`}
              >

            {/* 8. バックアップ・データ保護設定 */}
            {activeTab === 'settings' && (
              <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-6">
                <div>
                  <h2 className="text-lg font-bold text-slate-800 flex items-center">
                    <Icon name="shield-check" className="w-5 h-5 text-emerald-600 mr-2" />
                    データ保護 ＆ バックアップ管理
                  </h2>
                  <p className="text-xs text-slate-500 mt-1">
                    ブラウザのキャッシュ消去などで大事なデータが消えないよう、定期的にバックアップファイルをダウンロード保存してください。
                  </p>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {/* エクスポート */}
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                    <h3 className="font-bold text-xs text-slate-700 flex items-center">
                      <Icon name="download" className="w-4 h-4 mr-1.5 text-emerald-600" />
                      1. データをバックアップ保存（JSON）
                    </h3>
                    <p className="text-[11px] text-slate-500">
                      部員データ、振り返りノート、試合結果、目標などすべてのデータを1つのファイルとしてパソコンやスマホに保存します。
                    </p>
                    <button
                      onClick={() => {
                        const data = { members, matches, notes, goals };
                        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `soccer_note_backup_${new Date().toISOString().split('T')[0]}.json`;
                        a.click();
                        URL.revokeObjectURL(url);
                      }}
                      className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2.5 rounded-lg shadow transition flex items-center justify-center"
                    >
                      <Icon name="download" className="w-4 h-4 mr-1.5" /> バックアップファイルをダウンロード
                    </button>
                  </div>

                  {/* インポート */}
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                    <h3 className="font-bold text-xs text-slate-700 flex items-center">
                      <Icon name="upload" className="w-4 h-4 mr-1.5 text-blue-600" />
                      2. バックアップファイルから復元
                    </h3>
                    <p className="text-[11px] text-slate-500">
                      以前保存したバックアップ（.json）を読み込んでデータを復元・復旧します。
                    </p>
                    <label className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-2.5 rounded-lg shadow transition flex items-center justify-center cursor-pointer">
                      <Icon name="upload" className="w-4 h-4 mr-1.5" /> バックアップファイルを選択して復元
                      <input
                        type="file"
                        accept=".json"
                        className="hidden"
                        onChange={(e) => {
                          const file = e.target.files[0];
                          if (!file) return;
                          const reader = new FileReader();
                          reader.onload = (event) => {
                            try {
                              const data = JSON.parse(event.target.result);
                              if (data.members) setMembers(data.members);
                              if (data.matches) setMatches(data.matches);
                              if (data.notes) setNotes(data.notes);
                              if (data.goals) setGoals(data.goals);
                              alert('データを正常に復元しました！');
                            } catch (err) {
                              alert('ファイルの読み込みに失敗しました。正しいJSON形式ファイルか確認してください。');
                            }
                          };
                          reader.readAsText(file);
                        }}
                      />
                    </label>
                  </div>
                </div>

                {/* データ一括初期化 */}
                <div className="bg-rose-50 p-4 rounded-xl border border-rose-200 space-y-2">
                  <h3 className="font-bold text-xs text-rose-800 flex items-center">
                    <Icon name="alert-triangle" className="w-4 h-4 mr-1.5 text-rose-600" />
                    データリセット（警告）
                  </h3>
                  <p className="text-[11px] text-rose-700">
                    現在の端末に保存されている全データを消去します。バックアップをあらかじめダウンロードしておくことを推奨します。
                  </p>
                  <button
                    onClick={() => {
                      if (window.confirm('本当にすべてのデータをリセットしますか？この操作は取り消せません。')) {
                        setMembers([]);
                        setMatches([]);
                        setNotes([]);
                        setGoals([]);
                        localStorage.clear();
                        alert('すべてのデータを削除しました。');
                      }
                    }}
                    className="bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs px-4 py-2 rounded-lg transition"
                  >
                    全データを消去してリセットする
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* Modal 1: Passcode */}
          {showPasscodeModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl space-y-4 border border-slate-200">
                <div className="text-center space-y-2">
                  <div className="p-3 bg-amber-100 text-amber-700 rounded-full inline-block">
                    <Icon name="lock" className="w-6 h-6" />
                  </div>
                  <h3 className="font-bold text-slate-800 text-base">監督・コーチ専用エリア</h3>
                  <p className="text-xs text-slate-500">認証用パスコードを入力してください。</p>
                </div>

                <form onSubmit={handleVerifyPasscode} className="space-y-3">
                  <input
                    type="password"
                    placeholder="パスコード"
                    value={inputPasscode}
                    onChange={e => setInputPasscode(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-center text-lg font-mono tracking-widest focus:ring-2 focus:ring-amber-500 outline-none"
                    autoFocus
                  />

                  <div className="flex justify-end space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowPasscodeModal(false)}
                      className="px-4 py-2 bg-slate-100 text-slate-600 text-xs font-bold rounded-lg transition"
                    >
                      キャンセル
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-lg shadow transition"
                    >
                      解除して入場
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal 2: Coach Feedback */}
          {selectedNote && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl space-y-4 border border-slate-200 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-3">
                  <div>
                    <h3 className="font-bold text-slate-800 text-base">監督・コーチからのフィードバック</h3>
                    <p className="text-xs text-slate-500">対象: {selectedNote.studentName} の振り返り ({selectedNote.date})</p>
                  </div>
                  <button
                    onClick={() => setSelectedNote(null)}
                    className="text-slate-400 hover:text-slate-600 text-sm font-bold px-2"
                  >
                    ✕
                  </button>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">差出人</label>
                  <input
                    type="text"
                    value={coachName}
                    onChange={e => setCoachName(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-300 rounded p-2 text-xs"
                  />
                </div>

                <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs space-y-1">
                  <p className="font-bold text-slate-800">{selectedNote.title}</p>
                  <p className="text-slate-600"><span className="text-emerald-700 font-bold">成果:</span> {selectedNote.goodPoints}</p>
                  <p className="text-slate-600"><span className="text-amber-700 font-bold">課題:</span> {selectedNote.badPoints}</p>
                </div>

                <div className="space-y-3">
                  <div className="flex justify-between items-center bg-amber-50 p-3 rounded-lg border border-amber-200">
                    <div>
                      <label className="block text-xs font-bold text-amber-900">評価（5段階）</label>
                      <div className="flex space-x-1 mt-1">
                        {[1, 2, 3, 4, 5].map((star) => (
                          <button
                            key={star}
                            type="button"
                            onClick={() => setReplyRating(star)}
                            className={`p-1 rounded transition ${star <= replyRating ? 'text-amber-400' : 'text-slate-300'}`}
                          >
                            <Icon name="star" className="w-5 h-5 fill-current" />
                          </button>
                        ))}
                      </div>
                    </div>

                    <label className="flex items-center space-x-2 text-xs font-bold text-slate-700 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={isMomCheck}
                        onChange={e => setIsMomCheck(e.target.checked)}
                        className="rounded text-amber-500 focus:ring-amber-400 w-4 h-4"
                      />
                      <span>👑 本日のMOMに選出（全員に公開）</span>
                    </label>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">アドバイス・コメント</label>
                    <textarea
                      rows="4"
                      value={replyText}
                      onChange={(e) => setReplyText(e.target.value)}
                      placeholder="良かった点の承認や具体的アドバイスを記述してください。"
                      className="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-amber-500 outline-none"
                    ></textarea>
                  </div>
                </div>

                <div className="flex justify-end space-x-2 pt-2 border-t">
                  <button
                    onClick={() => setSelectedNote(null)}
                    className="px-4 py-2 bg-slate-100 text-slate-600 text-xs font-bold rounded-lg transition"
                  >
                    キャンセル
                  </button>
                  <button
                    onClick={handleSendReply}
                    className="px-5 py-2 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-lg shadow transition flex items-center"
                  >
                    <Icon name="send" className="w-3.5 h-3.5 mr-1.5" />
                    送信する
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal 3: Student Reply */}
          {replyToCoachNote && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl space-y-4 border border-slate-200">
                <div className="flex justify-between items-center border-b pb-3">
                  <div>
                    <h3 className="font-bold text-slate-800 text-base">監督のアドバイスへ返答</h3>
                    <p className="text-xs text-slate-500">感謝や次の行動への決意を伝えましょう</p>
                  </div>
                  <button
                    onClick={() => setReplyToCoachNote(null)}
                    className="text-slate-400 hover:text-slate-600 text-sm font-bold px-2"
                  >
                    ✕
                  </button>
                </div>

                <div className="bg-amber-50 p-3 rounded-lg border border-amber-200 text-xs space-y-1">
                  <p className="font-bold text-amber-900">{replyToCoachNote.coachName || '監督・コーチ'} からのアドバイス:</p>
                  <p className="text-slate-700">{replyToCoachNote.coachComment}</p>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">返答メッセージ</label>
                  <textarea
                    rows="3"
                    value={studentReplyText}
                    onChange={e => setStudentReplyText(e.target.value)}
                    placeholder="例: アドバイスありがとうございます！明日の練習で早速意識してやってみます！"
                    className="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-emerald-500 outline-none"
                  ></textarea>
                </div>

                <div className="flex justify-end space-x-2 pt-2 border-t">
                  <button
                    onClick={() => setReplyToCoachNote(null)}
                    className="px-4 py-2 bg-slate-100 text-slate-600 text-xs font-bold rounded-lg transition"
                  >
                    キャンセル
                  </button>
                  <button
                    onClick={handleSendStudentReply}
                    className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg shadow transition flex items-center"
                  >
                    <Icon name="send" className="w-3.5 h-3.5 mr-1.5" />
                    送信する
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SoccerNoteApp />);
  </script>
</body>
</html>
